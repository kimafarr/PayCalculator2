
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Weekly Pay Calculator</title>
</head>
<body>
  <h2>Weekly Pay Calculator</h2>

  <label>Hourly Rate ($)</label>
  <input type="number" id="rate"
         value="19" min="0" step="0.01">

  <br><br>

  <label>Hours Worked This Week</label>
  <input type="number" id="hours"
         value="35" min="0" step="0.01">

  <br><br>

  <button onclick="calculatePay()">
    Calculate Pay
  </button>

  <h3 id="gross"></h3>
  <p id="taxes"></p>
  <p id="fica"></p>
  <h2 id="takehome"></h2>

  <script>
    function calculatePay() {
      const rate = Number(
        document.getElementById("rate").value
      );

      const hours = Number(
        document.getElementById("hours").value
      );

      if (rate < 0 || hours < 0) {
        alert("Enter valid positive numbers.");
        return;
      }

      const grossPay = rate * hours;
      const taxes = grossPay * 0.1039;
      const fica = grossPay * 0.0765;
      const takeHome = grossPay - taxes - fica;

      document.getElementById("gross").textContent =
        "Gross Pay: $" + grossPay.toFixed(2);

      document.getElementById("taxes").textContent =
        "Estimated Income Taxes: $" + taxes.toFixed(2);

      document.getElementById("fica").textContent =
        "Social Security + Medicare: $" + fica.toFixed(2);

      document.getElementById("takehome").textContent =
        "Take-Home Pay: $" + takeHome.toFixed(2);
    }
  </script>
</body>
</html>
